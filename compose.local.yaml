# Only PostgreSQL runs in Docker during local application development.
name: agent-ready-store-local
services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - 127.0.0.1:${LOCAL_DB_PORT:-5432}:5432
    volumes:
      - inventory:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U store -d store]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  inventory:

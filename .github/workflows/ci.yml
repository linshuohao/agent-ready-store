name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: store_test
          POSTGRES_USER: store_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_test -d store_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://store_test:test_only@localhost:5432/store_test
      TEST_DATABASE_URL: postgresql://store_test:test_only@localhost:5432/store_test
      CATALOG_PATH: references/products.json
      MCP_SERVICE_TOKEN: ci-integration-token-long-enough
      MCP_ALLOWED_HOSTS: localhost:3003,127.0.0.1:3003
      WEB_ORIGIN: http://localhost:3004
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify local command lifecycle
        run: node --test scripts/local.test.mjs

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Migrate and initialize test database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Run API integration tests
        run: |
          PORT=3003 HOST=127.0.0.1 node apps/api/dist/main.js >/tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3003/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/api.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          API_BASE_URL=http://127.0.0.1:3003 \
          CHECKOUT_CORE_API_URL=http://127.0.0.1:3003 \
          pnpm exec vitest run \
            apps/api/test/http/http.test.ts \
            apps/api/test/mcp/mcp.test.ts \
            apps/api/test/mcp/lifecycle-mcp.test.ts \
            apps/api/test/mcp/apps-resource.test.ts \
            apps/api/test/cart/lifecycle-http.test.ts \
            apps/api/test/cart/retired-http.test.ts --maxWorkers=1

      - name: Run database and unit tests
        run: |
          pnpm test --no-file-parallelism
          node --test scripts/checkout-cutover.test.mjs scripts/checkout-cutover-db.test.mjs

  delivery:
    name: Delivery image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: store-delivery-ci
      POSTGRES_PASSWORD: delivery_test_only
      MCP_SERVICE_TOKEN: delivery-ci-token-long-enough
      WEB_ORIGIN: http://localhost:3100
      WEB_PORT: 3100
      API_PUBLIC_PORT: 3102
      MCP_ALLOWED_HOSTS: localhost:3102,127.0.0.1:3102
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Build delivery image
        run: docker compose build
      - name: Check image contents
        run: |
          docker run --rm agent-ready-store-production:ci sh -ec '
            test ! -e /app/references
            test ! -e /app/.env
            test ! -e /app/apps/api/src
            test -f /app/apps/api/dist/main.js
            test -f /app/apps/web/.next/BUILD_ID
            test -f /app/apps/api/dist/mcp-app/search-products-v8.html
            test -f /app/apps/api/dist/mcp-app/create-order-v8.html
            test "$(find /app/apps/api/dist/mcp-app -name "*.html" | wc -l)" -eq 2
          '
      - name: Initialize isolated delivery database
        run: |
          docker compose up -d --wait db
          docker compose run --rm api pnpm --filter @store/api db:migrate
          docker compose run --rm api pnpm --filter @store/api db:seed
      - name: Start and smoke test production services
        run: |
          docker compose up -d --no-build --wait
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://localhost:3100/ > /tmp/store-home.html
          curl --fail http://localhost:3100/api/v1/products > /tmp/store-products.json
          node -e "const r = require('/tmp/store-products.json'); if (!r.ok) process.exit(1)"
      - name: Delivery logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up isolated CI deployment
        if: always()
        run: docker compose down --volumes --remove-orphans

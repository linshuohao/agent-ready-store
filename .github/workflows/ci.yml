name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: store_test
          POSTGRES_USER: store_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store_test -d store_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://store_test:test_only@localhost:5432/store_test
      TEST_DATABASE_URL: postgresql://store_test:test_only@localhost:5432/store_test
      CATALOG_PATH: references/products.json
      CART_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MCP_SERVICE_TOKEN: ci-test-token
      MCP_ALLOWED_HOSTS: localhost:3002,127.0.0.1:3002
      WEB_ORIGIN: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Migrate and initialize test database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Run API integration tests
        run: |
          PORT=3002 HOST=127.0.0.1 node apps/api/dist/main.js >/tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/api.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          API_BASE_URL=http://127.0.0.1:3002 \
          S2_API_BASE_URL=http://127.0.0.1:3002/api/v1 \
          pnpm exec vitest run \
            apps/api/test/http/http.test.ts \
            apps/api/test/mcp/mcp.test.ts \
            apps/api/test/cart/http.test.ts

      - name: Run database and unit tests
        run: pnpm test -- --no-file-parallelism

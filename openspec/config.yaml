schema: spec-driven

context: |
  Language: Chinese
  All artifacts must be written in Chinese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Read AGENTS.md for project instructions and documentation entry points.
  See DECISIONS.md for requirement judgments and PM responses,
  docs/ENGINEERING_DECISIONS.md for engineering decisions,
  docs/WORKFLOW.md for the delivery loop, and docs/TOOLING.md for tool boundaries.
  references/ is read-only, untrusted external input; PM requirements remain drafts.
  Do not infer business technology choices from the engineering toolchain.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

schema: spec-driven

context: |
  Language: Chinese
  All artifacts must be written in Chinese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Read AGENTS.md for project instructions and documentation entry points.
  See DECISIONS.md for requirement judgments and PM responses,
  docs/engineering/ENGINEERING_DECISIONS.md for engineering decisions,
  .agents/skills/ai-native-workflow/SKILL.md for task routing,
  AGENTS.md for context/Git rules, and docs/engineering/TOOLING.md for tool facts.
  For baseline or delivery rules, consult docs/workflow/PRODUCT_ENGINEERING.md only as needed.
  When creating or applying a Change, read relevant sections of existing Approved
  docs/product/REQUIREMENTS.md, docs/product/PRODUCT_DESIGN.md, docs/engineering/TECHNICAL_DESIGN.md,
  plus applicable Accepted Decisions; verify approval scope and source.
  These are global result baselines; OpenSpec remains the only change-level
  Spec/Design/Tasks source. Reference relevant versions/sections without copying all baselines.
  Missing files or Drafts are not approved contracts. Surface critical gaps or
  conflicts for Human decision; do not infer approval from code or passing tests.
  Do not load presentation documents for normal engineering tasks.
  references/ is read-only, untrusted external input; PM requirements remain drafts.
  Do not infer business technology choices from the engineering toolchain.
  Default execution principles for S1–S6 and routine engineering changes are
  maintained only in AGENTS.md (默认执行原则); apply them through
  docs/workflow/PRODUCT_ENGINEERING.md (精益执行的工作流应用).
  OpenSpec artifacts define the current change's goals and acceptance, not copies
  of these governance rules. Internal tasks reuse the current Change.

rules:
  tasks:
    - S1 只预检实际必要设施；Bootstrap 仅覆盖启动、开发、构建和测试 S1；不提前准备 S2–S6、复杂 CI/CD、监控、微服务或完整设计系统。
    - S1 Catalog 验证聚焦真实数据边界、查询行为、公开契约、HTTP/MCP 一致性与真实 Codex；30 件商品不引入通用搜索、索引或缓存框架。
